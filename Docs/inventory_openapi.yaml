openapi: 3.1.0
info:
  title: Inventory Service API
  version: 1.0.0
  description: |
    Administrative API for importing train-set compositions and changing their
    lifecycle. The inventory database is the source of truth for lifecycle
    transitions. A newly imported train set is always created in DRAFT.
servers:
  - url: http://157.22.189.188:8082
    description: Nginx server port

tags:
  - name: Train sets
    description: Train-set import and lifecycle operations

paths:
  /api/v1/inventory/train-sets/import:
    post:
      tags: [Train sets]
      operationId: importTrainSet
      summary: Import a complete train-set composition
      description: |
        Imports a complete train-set composition in one database transaction.
        The payload deliberately contains no database IDs. Carriage types are
        referenced from carriages using a relative `ref` / `carriageTypeRef`
        pair. The import creates the train set, its physical carriages,
        carriage types, schemes and seat positions. CDC and changelog tables
        are not part of the import.

        A newly imported train set is always created in DRAFT. If the import
        violates a uniqueness or other database constraint, the whole import
        is rolled back and the API returns 409 Conflict for data conflicts.
      security:
        - cookieSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TrainSetImportRequest'
      responses:
        '201':
          description: Imported train set in DRAFT status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrainSetResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/v1/inventory/train-sets/{trainSetId}/lifecycle:
    post:
      tags: [Train sets]
      operationId: changeTrainSetLifecycle
      summary: Change a train-set lifecycle status
      description: |
        Requests a lifecycle transition. The database remains the authoritative
        source of allowed transitions. Invalid transitions are rejected with
        400 Bad Request. Entering ACTIVE causes the database to create the
        immutable train-set CDC snapshot.
      security:
        - cookieSession: []
      parameters:
        - $ref: '#/components/parameters/TrainSetId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TrainSetLifecycleRequest'
      responses:
        '200':
          description: Lifecycle status after the transition
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrainSetLifecycleResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Train set not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  securitySchemes:
    cookieSession:
      type: apiKey
      in: cookie
      name: SESSION
      description: Session cookie authenticated by Oathkeeper.

  parameters:
    TrainSetId:
      name: trainSetId
      in: path
      required: true
      description: Database identifier of the train set.
      schema:
        type: integer
        format: int32

  schemas:
    TrainSetImportRequest:
      type: object
      required: [code, buildNumber, name, technicalName, carriages]
      properties:
        code:
          type: string
          maxLength: 64
        buildNumber:
          type: integer
          minimum: 1
        name:
          type: string
          maxLength: 255
        technicalName:
          type: string
          maxLength: 255
        description:
          type: [string, 'null']
        carriages:
          type: array
          items:
            $ref: '#/components/schemas/CarriageImport'

    CarriageImport:
      type: object
      required: [carriageType, inventoryNumber, serialNumber, carriageNumber, position]
      properties:
        inventoryNumber:
          type: string
          maxLength: 128
        serialNumber:
          type: string
          maxLength: 128
        isActive:
          type: boolean
          default: true
        carriageNumber:
          type: string
          maxLength: 16
        position:
          type: integer
          minimum: 1
        carriageType:
          $ref: '#/components/schemas/CarriageTypeImport'

    CarriageTypeImport:
      type: object
      required: [ref, code, name]
      properties:
        ref:
          type: string
          minLength: 1
          description: Local reference used to reuse the same carriage type in this import.
        code:
          type: string
          maxLength: 64
        name:
          type: string
          maxLength: 255
        description:
          type: [string, 'null']
        scheme:
          $ref: '#/components/schemas/CarriageTypeSchemeImport'
        schemes:
          type: array
          description: Optional additional scheme versions for this carriage type.
          items:
            $ref: '#/components/schemas/CarriageTypeSchemeImport'

    CarriageTypeSchemeImport:
      type: object
      required: [code, name, storageKey, version]
      properties:
        code:
          type: string
          maxLength: 64
        name:
          type: string
          maxLength: 255
        storageKey:
          type: string
          maxLength: 1024
        version:
          type: integer
          minimum: 1
        isActive:
          type: boolean
          default: false
        seatPositions:
          type: array
          default: []
          items:
            $ref: '#/components/schemas/SeatPositionImport'

    SeatPositionImport:
      type: object
      required: [seatNumber, x, y]
      properties:
        seatNumber:
          type: string
          maxLength: 3
        x:
          type: number
          format: double
        y:
          type: number
          format: double
        rotation:
          type: number
          format: double
          default: 0

    TrainSetResponse:
      type: object
      required: [id, code, buildNumber, name, technicalName, trainSetLifecycleStatusId, createdAt, updatedAt]
      properties:
        id:
          type: integer
          format: int32
        code:
          type: string
        buildNumber:
          type: integer
        name:
          type: string
        technicalName:
          type: string
        description:
          type: [string, 'null']
        trainSetLifecycleStatusId:
          type: integer
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    TrainSetLifecycleRequest:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [DRAFT, ACTIVE, MAINTENANCE, RETIRED]

    TrainSetLifecycleResponse:
      type: object
      required: [trainSetId, status]
      properties:
        trainSetId:
          type: integer
          format: int32
        status:
          type: string

    ErrorResponse:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
        message:
          type: string

  responses:
    BadRequest:
      description: Invalid request or invalid lifecycle transition
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Authentication required
    Forbidden:
      description: Authenticated user is not allowed to access inventory
    Conflict:
      description: Import conflicts with existing inventory data
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
