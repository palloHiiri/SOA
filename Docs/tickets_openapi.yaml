openapi: 3.0.3
info:
  title: Tickets Service API
  version: '1.0'
  description: |
    REST/JSON API of the railway tickets service.

    Tickets, venues and price histories are owned by this service. Inventory data is
    read-only here and is projected from the latest JSONB CDC snapshot received from
    Inventory.
servers:
  - url: https://157.22.189.188:8443/api/v1/tickets
    description: Nginx server port

tags:
  - name: Tickets
  - name: Venues
  - name: Price histories
  - name: Inventory projection

paths:
  /tickets:
    get:
      tags: [Tickets]
      operationId: listTickets
      summary: List tickets
      description: |
        Returns a paginated collection of tickets. The base price and discount are
        taken from the latest price-history record of each ticket.

        Allowed sort fields: id, name, creationDate, venueId, trainSetId, carriageNumber,
        seatNumber, refundable, type, basePrice, discount. Default: id,asc.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - $ref: '#/components/parameters/Sort'
        - $ref: '#/components/parameters/TicketIdQuery'
        - $ref: '#/components/parameters/TicketNameQuery'
        - $ref: '#/components/parameters/TicketCreationDateQuery'
        - $ref: '#/components/parameters/TicketVenueIdQuery'
        - $ref: '#/components/parameters/TicketTrainSetIdQuery'
        - $ref: '#/components/parameters/TicketCarriageNumberQuery'
        - $ref: '#/components/parameters/TicketSeatNumberQuery'
        - $ref: '#/components/parameters/TicketRefundableQuery'
        - $ref: '#/components/parameters/TicketTypeQuery'
        - $ref: '#/components/parameters/TicketBasePriceQuery'
        - $ref: '#/components/parameters/TicketDiscountQuery'
      responses:
        '200':
          description: Tickets returned successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TicketPageResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags: [Tickets]
      operationId: createTicket
      summary: Create a ticket
      description: |
        Creates a ticket for a Venue and a seat. The carriage and seat must exist in
        the latest Inventory snapshot for the Venue's train set.

        If `name` is omitted or is null, the service generates:
        `Билет: {seatNumber}, вагон: {carriageNumber} рейс: {venueName}`.

        The ticket and its initial price-history record are created in one database
        transaction.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TicketCreateRequest'
      responses:
        '201':
          description: Ticket created successfully.
          headers:
            Location:
              description: URL of the created ticket.
              schema:
                type: string
                format: uri-reference
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ticket'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          description: Venue or the required Inventory snapshot does not exist.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: The selected seat is already occupied for this Venue, or another unique constraint was violated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalError'

  /tickets/{id}:
    parameters:
      - $ref: '#/components/parameters/TicketIdPath'
    get:
      tags: [Tickets]
      operationId: getTicket
      summary: Get a ticket by ID
      responses:
        '200':
          description: Ticket found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ticket'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    put:
      tags: [Tickets]
      operationId: updateTicket
      summary: Update a ticket
      description: |
        Updates ticket-owned fields. Price and discount are not changed by this
        operation; append a price-history record through POST /price-histories.

        The selected carriage and seat must exist in the latest Inventory snapshot
        for the selected Venue's train set.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TicketUpdateRequest'
      responses:
        '200':
          description: Ticket updated successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ticket'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: The selected seat is already occupied for the selected Venue, or another unique constraint was violated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags: [Tickets]
      operationId: deleteTicket
      summary: Delete a ticket
      responses:
        '204':
          description: Ticket deleted successfully.
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /tickets/latest:
    get:
      tags: [Tickets]
      operationId: getLatestTicket
      summary: Return a ticket with the maximum creation date
      description: Returns any ticket whose `creationDate` equals the maximum value in the collection.
      responses:
        '200':
          description: Latest ticket found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ticket'
        '404':
          description: Ticket collection is empty.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalError'

  /tickets/discount/average:
    get:
      tags: [Tickets]
      operationId: getAverageDiscount
      summary: Calculate the average current discount
      description: Calculates the average of the latest discount value for all tickets.
      responses:
        '200':
          description: Average discount calculated.
          content:
            application/json:
              schema:
                type: number
                format: double
        '404':
          description: Ticket collection is empty.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalError'

  /tickets/by-discount-below/{discount}:
    get:
      tags: [Tickets]
      operationId: listTicketsByDiscountBelow
      summary: List tickets with discount below a threshold
      description: |
        Returns tickets whose current discount is strictly less than the supplied
        threshold. The response is paginated and supports sorting and additional
        ticket filters.

        Allowed sort fields: id, name, creationDate, venueId, trainSetId, carriageNumber,
        seatNumber, refundable, type, basePrice, discount. Default: id,asc.
      parameters:
        - $ref: '#/components/parameters/DiscountThresholdPath'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - $ref: '#/components/parameters/Sort'
        - $ref: '#/components/parameters/TicketVenueIdQuery'
        - $ref: '#/components/parameters/TicketTrainSetIdQuery'
        - $ref: '#/components/parameters/TicketCarriageNumberQuery'
        - $ref: '#/components/parameters/TicketSeatNumberQuery'
        - $ref: '#/components/parameters/TicketRefundableQuery'
        - $ref: '#/components/parameters/TicketTypeQuery'
      responses:
        '200':
          description: Matching tickets returned successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TicketPageResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'

  /venues:
    get:
      tags: [Venues]
      operationId: listVenues
      summary: List venues
      description: Returns a paginated collection of locally managed concrete departure/run instances.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - $ref: '#/components/parameters/Sort'
        - $ref: '#/components/parameters/VenueIdQuery'
        - $ref: '#/components/parameters/VenueNameQuery'
        - $ref: '#/components/parameters/VenueTrainSetIdQuery'
      responses:
        '200':
          description: Venues returned successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VenuePageResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags: [Venues]
      operationId: createVenue
      summary: Create a venue
      description: Creates a locally managed concrete departure/run instance linked to an Inventory train set.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VenueCreateRequest'
      responses:
        '201':
          description: Venue created successfully.
          headers:
            Location:
              description: URL of the created venue.
              schema:
                type: string
                format: uri-reference
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Venue'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          description: Inventory snapshot for the requested train set is unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: A Venue with the same name already exists.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalError'

  /venues/{id}:
    parameters:
      - $ref: '#/components/parameters/VenueIdPath'
    get:
      tags: [Venues]
      operationId: getVenue
      summary: Get a venue by ID
      responses:
        '200':
          description: Venue found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Venue'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    put:
      tags: [Venues]
      operationId: updateVenue
      summary: Update a venue
      description: trainSetId can be changed only while the Venue has no tickets.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VenueUpdateRequest'
      responses:
        '200':
          description: Venue updated successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Venue'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Venue name is already in use, or trainSetId change is forbidden because tickets exist.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags: [Venues]
      operationId: deleteVenue
      summary: Delete a venue
      responses:
        '204':
          description: Venue deleted successfully.
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Venue has tickets and cannot be deleted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalError'

  /price-histories:
    get:
      tags: [Price histories]
      operationId: listPriceHistories
      summary: List price-history records
      description: |
        Returns price-history records with pagination, sorting and filtering.
        Allowed sort fields: id, ticketId, changedDate, basePrice, discount.
        Default: changedDate,asc.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - $ref: '#/components/parameters/Sort'
        - $ref: '#/components/parameters/PriceHistoryIdQuery'
        - $ref: '#/components/parameters/PriceHistoryTicketIdQuery'
        - $ref: '#/components/parameters/ChangedDateFromQuery'
        - $ref: '#/components/parameters/ChangedDateToQuery'
        - $ref: '#/components/parameters/PriceHistoryBasePriceQuery'
        - $ref: '#/components/parameters/PriceHistoryDiscountQuery'
      responses:
        '200':
          description: Price-history records returned successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PriceHistoryPageResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags: [Price histories]
      operationId: createPriceHistory
      summary: Append a price-history record
      description: Appends a new price/discount state for an existing ticket.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PriceHistoryCreateRequest'
      responses:
        '201':
          description: Price-history record created successfully.
          headers:
            Location:
              description: URL of the created price-history record.
              schema:
                type: string
                format: uri-reference
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PriceHistory'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          description: Ticket does not exist.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalError'

  /price-histories/{id}:
    parameters:
      - $ref: '#/components/parameters/PriceHistoryIdPath'
    get:
      tags: [Price histories]
      operationId: getPriceHistory
      summary: Get a price-history record by ID
      responses:
        '200':
          description: Price-history record found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PriceHistory'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /train-sets:
    get:
      tags: [Inventory projection]
      operationId: listTrainSets
      summary: List Inventory train-set projections
      description: |
        Returns the latest available snapshot for each train_set_id stored in Tickets.
        Allowed sort fields: id, code, name, buildNumber, technicalName, snapshotVersion.
        Default: id,asc.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - $ref: '#/components/parameters/Sort'
        - $ref: '#/components/parameters/TrainSetIdQuery'
        - $ref: '#/components/parameters/TrainSetCodeQuery'
        - $ref: '#/components/parameters/TrainSetNameQuery'
        - $ref: '#/components/parameters/TrainSetBuildNumberQuery'
        - $ref: '#/components/parameters/TrainSetTechnicalNameQuery'
      responses:
        '200':
          description: Train-set projections returned successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrainSetPageResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'

  /train-sets/{trainSetId}:
    parameters:
      - $ref: '#/components/parameters/TrainSetIdPath'
    get:
      tags: [Inventory projection]
      operationId: getTrainSet
      summary: Get an Inventory train-set projection
      responses:
        '200':
          description: Train-set projection found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrainSet'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /train-sets/{trainSetId}/carriages:
    parameters:
      - $ref: '#/components/parameters/TrainSetIdPath'
    get:
      tags: [Inventory projection]
      operationId: listCarriages
      summary: List carriages in a train set
      description: |
        Returns carriages from the latest Inventory snapshot.
        Allowed sort fields: id, carriageNumber, position, inventoryNumber, serialNumber.
        Default: position,asc.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - $ref: '#/components/parameters/Sort'
        - $ref: '#/components/parameters/CarriageIdQuery'
        - $ref: '#/components/parameters/CarriageNumberQuery'
        - $ref: '#/components/parameters/CarriagePositionQuery'
        - $ref: '#/components/parameters/CarriageInventoryNumberQuery'
        - $ref: '#/components/parameters/CarriageSerialNumberQuery'
        - $ref: '#/components/parameters/CarriageTypeCodeQuery'
      responses:
        '200':
          description: Carriages returned successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CarriagePageResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /train-sets/{trainSetId}/carriages/{carriageNumber}/seats:
    parameters:
      - $ref: '#/components/parameters/TrainSetIdPath'
      - $ref: '#/components/parameters/CarriageNumberPath'
    get:
      tags: [Inventory projection]
      operationId: listSeats
      summary: List seats in a carriage
      description: |
        Returns seat positions from the latest Inventory snapshot.
        Allowed sort fields: id, seatNumber, x, y, rotation. Default: seatNumber,asc.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - $ref: '#/components/parameters/Sort'
        - $ref: '#/components/parameters/SeatNumberQuery'
        - $ref: '#/components/parameters/SeatXQuery'
        - $ref: '#/components/parameters/SeatYQuery'
        - $ref: '#/components/parameters/SeatRotationQuery'
      responses:
        '200':
          description: Seats returned successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SeatPageResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

components:
  parameters:
    Page:
      name: page
      in: query
      description: One-based page number. A page beyond the last page returns an empty content array.
      schema:
        type: integer
        minimum: 1
        default: 1
    Size:
      name: size
      in: query
      description: Page size. The current deployment limits it to 100.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    Sort:
      name: sort
      in: query
      description: |
        Repeat this query parameter for multiple sort criteria. Each value is
        `field` or `field,direction`, where direction is `asc` or `desc`.
        If direction is omitted, `asc` is used.
      style: form
      explode: true
      schema:
        type: array
        items:
          type: string
          pattern: '^[A-Za-z][A-Za-z0-9]*(,(asc|desc|ASC|DESC))?$'
      examples:
        descending:
          summary: Single descending sort
          value:
            - creationDate,desc
        multiple:
          summary: Multiple sort criteria
          value:
            - creationDate,desc
            - id,asc

    TicketIdPath:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
    VenueIdPath:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
    PriceHistoryIdPath:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
    TrainSetIdPath:
      name: trainSetId
      in: path
      required: true
      schema:
        type: integer
        format: int32
        minimum: 1
    CarriageNumberPath:
      name: carriageNumber
      in: path
      required: true
      description: Passenger-facing carriage number from Inventory.
      schema:
        type: string
        minLength: 1
        maxLength: 16

    DiscountThresholdPath:
      name: discount
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
        maximum: 100

    TicketIdQuery:
      name: id
      in: query
      schema:
        type: integer
        format: int64
    TicketNameQuery:
      name: name
      in: query
      description: Exact ticket-name filter.
      schema:
        type: string
    TicketCreationDateQuery:
      name: creationDate
      in: query
      schema:
        type: string
        format: date
    TicketVenueIdQuery:
      name: venueId
      in: query
      schema:
        type: integer
        format: int64
    TicketTrainSetIdQuery:
      name: trainSetId
      in: query
      schema:
        type: integer
        format: int32
    TicketCarriageNumberQuery:
      name: carriageNumber
      in: query
      schema:
        type: string
    TicketSeatNumberQuery:
      name: seatNumber
      in: query
      schema:
        type: string
    TicketRefundableQuery:
      name: refundable
      in: query
      schema:
        type: boolean
    TicketTypeQuery:
      name: type
      in: query
      schema:
        $ref: '#/components/schemas/TicketType'
    TicketBasePriceQuery:
      name: basePrice
      in: query
      schema:
        type: number
        format: double
    TicketDiscountQuery:
      name: discount
      in: query
      schema:
        type: integer

    VenueIdQuery:
      name: id
      in: query
      schema:
        type: integer
        format: int64
    VenueNameQuery:
      name: name
      in: query
      schema:
        type: string
    VenueTrainSetIdQuery:
      name: trainSetId
      in: query
      schema:
        type: integer
        format: int32

    PriceHistoryIdQuery:
      name: id
      in: query
      schema:
        type: integer
        format: int64
    PriceHistoryTicketIdQuery:
      name: ticketId
      in: query
      schema:
        type: integer
        format: int64
    ChangedDateFromQuery:
      name: changedDateFrom
      in: query
      description: Inclusive lower bound, parsed as OffsetDateTime.
      schema:
        type: string
        format: date-time
    ChangedDateToQuery:
      name: changedDateTo
      in: query
      description: Inclusive upper bound, parsed as OffsetDateTime.
      schema:
        type: string
        format: date-time
    PriceHistoryBasePriceQuery:
      name: basePrice
      in: query
      schema:
        type: number
        format: double
    PriceHistoryDiscountQuery:
      name: discount
      in: query
      schema:
        type: integer

    TrainSetIdQuery:
      name: id
      in: query
      schema:
        type: integer
        format: int32
    TrainSetCodeQuery:
      name: code
      in: query
      schema:
        type: string
    TrainSetNameQuery:
      name: name
      in: query
      schema:
        type: string
    TrainSetBuildNumberQuery:
      name: buildNumber
      in: query
      schema:
        type: integer
    TrainSetTechnicalNameQuery:
      name: technicalName
      in: query
      schema:
        type: string

    CarriageIdQuery:
      name: id
      in: query
      schema:
        type: integer
        format: int32
    CarriageNumberQuery:
      name: carriageNumber
      in: query
      schema:
        type: string
    CarriagePositionQuery:
      name: position
      in: query
      schema:
        type: integer
    CarriageInventoryNumberQuery:
      name: inventoryNumber
      in: query
      schema:
        type: string
    CarriageSerialNumberQuery:
      name: serialNumber
      in: query
      schema:
        type: string
    CarriageTypeCodeQuery:
      name: carriageTypeCode
      in: query
      schema:
        type: string

    SeatNumberQuery:
      name: seatNumber
      in: query
      schema:
        type: string
    SeatXQuery:
      name: x
      in: query
      schema:
        type: number
        format: double
    SeatYQuery:
      name: y
      in: query
      schema:
        type: number
        format: double
    SeatRotationQuery:
      name: rotation
      in: query
      schema:
        type: number
        format: double

  responses:
    BadRequest:
      description: Invalid request data or query/path parameter.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Requested object was not found.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InternalError:
      description: Unexpected server or database error.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  schemas:
    TicketType:
      type: string
      enum: [VIP, USUAL, CHEAP]

    Ticket:
      type: object
      required:
        - id
        - name
        - creationDate
        - basePrice
        - discount
        - refundable
        - type
        - venue
        - carriageNumber
        - seatNumber
      properties:
        id:
          type: integer
          format: int64
