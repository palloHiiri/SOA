- id: tickets-api-options
  upstream:
    url: http://nginx:80
  match:
    url: <.*/api/v1/tickets(?:/.*)?>
    methods:
      - OPTIONS
  authenticators:
    - handler: anonymous
      config:
        subject: guest
  authorizer:
    handler: allow
  mutators:
    - handler: noop

- id: tickets-api
  upstream:
    url: http://nginx:80
  match:
    url: <.*/api/v1/tickets(?:/.*)?>
    methods:
      - GET
      - POST
      - PUT
      - DELETE
  authenticators:
    - handler: anonymous
      config:
        subject: guest
  authorizer:
    handler: allow
  mutators:
    - handler: noop
