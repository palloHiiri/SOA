- id: sso-ident-me
  upstream:
    url: http://nginx:80
  match:
    url: <.*/api/v1/sso-ident/me>
    methods:
      - GET
  authenticators:
    - handler: cookie_session
  authorizer:
    handler: remote_json
  mutators:
    - handler: header

- id: sso-ident-me-groups
  upstream:
    url: http://nginx:80
  match:
    url: <.*/api/v1/sso-ident/me/groups>
    methods:
      - GET
  authenticators:
    - handler: cookie_session
  authorizer:
    handler: remote_json
  mutators:
    - handler: header

- id: sso-ident-admin-add-group
  upstream:
    url: http://nginx:80
  match:
    url: <.*/api/v1/sso-ident/admin/users/[0-9a-fA-F-]+/groups>
    methods:
      - POST
  authenticators:
    - handler: cookie_session
  authorizer:
    handler: remote_json
    config:
      payload: |
        {
          "namespace": "Role",
          "object": "Admin",
          "relation": "members",
          "subject_id": "{{ print .Subject }}"
        }
  mutators:
    - handler: header

- id: sso-ident-admin-remove-group
  upstream:
    url: http://nginx:80
  match:
    url: <.*/api/v1/sso-ident/admin/users/[0-9a-fA-F-]+/groups/.+>
