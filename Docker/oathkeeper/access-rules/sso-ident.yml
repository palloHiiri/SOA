- id: sso-ident-login-public
  upstream:
    url: http://nginx:80
  match:
    url: <.*/api/v1/sso-ident/auth/login>
    methods:
      - POST
  authenticators:
    - handler: anonymous
      config:
        subject: guest
  authorizer:
    handler: allow
  mutators:
    - handler: noop

