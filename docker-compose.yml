services:
  postgres:
    image: postgres:17-alpine
    container_name: postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./Docker/postgres/01-create-databases.sql:/docker-entrypoint-initdb.d/01-create-databases.sql:ro
    command: ["postgres", "-c", "wal_level=logical", "-c", "max_wal_senders=4", "-c", "max_replication_slots=4"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 3s
      retries: 20

  sso-redis:
    image: redis:8-alpine
    container_name: sso-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v26.2.2
    container_name: redpanda
    restart: unless-stopped
    command:
      - redpanda
      - start
      - --kafka-addr
      - internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr
      - internal://redpanda:9092,external://localhost:19092
      - --pandaproxy-addr
      - internal://0.0.0.0:8082,external://0.0.0.0:18082
      - --advertise-pandaproxy-addr
      - internal://redpanda:8082,external://localhost:18082
      - --schema-registry-addr
      - internal://0.0.0.0:8081,external://localhost:18081
      - --rpc-addr
      - redpanda:33145
      - --advertise-rpc-addr
      - redpanda:33145
      - --mode
      - dev-container
      - --smp
      - "1"
      - --default-log-level=info
      - --set
      - redpanda.auto_create_topics_enabled=false
    ports:
      - "18081:8081"
      - "18082:8082"
      - "19092:9092"
      - "19644:9644"
    volumes:
      - redpanda_data:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD", "rpk", "cluster", "health"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s

  redpanda-topic-init:
    image: docker.redpanda.com/redpandadata/redpanda:v26.2.2
    container_name: redpanda-topic-init
    restart: "no"
    depends_on:
      redpanda:
        condition: service_healthy
    volumes:
      - ./Docker/redpanda/init-topics.sh:/init-topics.sh:ro
    entrypoint: ["/bin/sh", "/init-topics.sh"]
    environment:
      REDPANDA_BROKERS: redpanda:9092

  redpanda-console:
    image: docker.redpanda.com/redpandadata/console:v3.11.0
    container_name: redpanda-console
    restart: unless-stopped
    depends_on:
      redpanda:
        condition: service_healthy
      debezium-connect:
        condition: service_healthy
    entrypoint: /bin/sh
    command: -c 'echo "$$CONSOLE_CONFIG_FILE" > /tmp/config.yml; /app/console'
    environment:
      CONFIG_FILEPATH: /tmp/config.yml
      CONSOLE_CONFIG_FILE: |
        kafka:
          brokers: ["redpanda:9092"]
        schemaRegistry:
          enabled: true
          urls: ["http://redpanda:8081"]
        redpanda:
          adminApi:
            enabled: true
            urls: ["http://redpanda:9644"]
        kafkaConnect:
          enabled: true
          clusters:
            - name: debezium
              url: http://debezium-connect:8083
    ports:
      - "8088:8080"

  debezium-connect:
    image: quay.io/debezium/connect:3.5.2.Final
    container_name: debezium-connect
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redpanda-topic-init:
        condition: service_completed_successfully
      liquibase:
        condition: service_completed_successfully
    environment:
      BOOTSTRAP_SERVERS: redpanda:9092
      GROUP_ID: 1
      CONFIG_STORAGE_TOPIC: _connect_configs
      OFFSET_STORAGE_TOPIC: _connect_offsets
      STATUS_STORAGE_TOPIC: _connect_status
      CONFIG_STORAGE_REPLICATION_FACTOR: 1
      OFFSET_STORAGE_REPLICATION_FACTOR: 1
      STATUS_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_TOPIC_CREATION_ENABLE: "false"
      REST_PORT: 8083
      REST_HOST_NAME: 0.0.0.0
      KEY_CONVERTER: org.apache.kafka.connect.storage.StringConverter
      VALUE_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      VALUE_CONVERTER_SCHEMAS_ENABLE: "false"
      INTERNAL_KEY_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      INTERNAL_VALUE_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      INTERNAL_KEY_CONVERTER_SCHEMAS_ENABLE: "false"
      INTERNAL_VALUE_CONVERTER_SCHEMAS_ENABLE: "false"
      OFFSET_FLUSH_INTERVAL_MS: 1000
      PLUGIN_PATH: /kafka/connect
    ports:
      - "8083:8083"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8083/connector-plugins >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  debezium-connector-init:
    image: curlimages/curl:8.16.0
    container_name: debezium-connector-init
    restart: "no"
    depends_on:
      debezium-connect:
        condition: service_healthy
      redpanda-topic-init:
        condition: service_completed_successfully
    volumes:
      - ./Docker/debezium/register-connector.sh:/register-connector.sh:ro
      - ./Docker/debezium/connectors:/connectors:ro
    environment:
      CONNECT_URL: http://debezium-connect:8083
      CONNECTOR_CONFIG_DIR: /connectors
    entrypoint: ["/bin/sh", "/register-connector.sh"]

  keto-migrate:
    image: oryd/keto:v26.2.0
    container_name: sso-keto-migrate
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DSN: postgresql://postgres:postgres@postgres:5432/keto?sslmode=disable
    volumes:
      - ./Docker/keto/keto.yml:/etc/keto/keto.yml:ro
      - ./Docker/keto/namespaces:/etc/keto/namespaces:ro
    command: migrate up --config /etc/keto/keto.yml --yes

  keto:
    image: oryd/keto:v26.2.0
    container_name: sso-keto
    restart: unless-stopped
    depends_on:
      keto-migrate:
        condition: service_completed_successfully
    environment:
      DSN: postgresql://postgres:postgres@postgres:5432/keto?sslmode=disable
    volumes:
      - ./Docker/keto/keto.yml:/etc/keto/keto.yml:ro
      - ./Docker/keto/namespaces:/etc/keto/namespaces:ro
    ports:
      - "4466:4466"
      - "4467:4467"
    command: serve --config /etc/keto/keto.yml

  keto-init:
    image: curlimages/curl:8.16.0
    container_name: sso-keto-init
    restart: "no"
    depends_on:
      keto:
        condition: service_started
    volumes:
      - ./Docker/keto/init.sh:/init.sh:ro
    command: ["sh", "/init.sh"]

  liquibase:
    image: liquibase:4.33
    container_name: postgres-migrations
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - ./Database:/liquibase/changelog:ro
      - ./Docker/liquibase/migrate.sh:/liquibase/migrate.sh:ro
    command: ["sh", "/liquibase/migrate.sh"]

  sso-ident:
    build:
      context: ./Services/sso-ident
    image: soa-labs/sso-ident:local
    container_name: sso-ident
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redpanda-topic-init:
        condition: service_completed_successfully
      keto-init:
        condition: service_completed_successfully
      liquibase:
        condition: service_completed_successfully
    environment:
      SPRING_R2DBC_URL: r2dbc:postgresql://postgres:5432/sso_ident
      SPRING_R2DBC_USERNAME: postgres
      SPRING_R2DBC_PASSWORD: postgres
      SPRING_KAFKA_BOOTSTRAP_SERVERS: redpanda:9092
      SPRING_REDIS_HOST: sso-redis
      SPRING_REDIS_PORT: 6379
      SSO_KAFKA_USER_REGISTRATION_TOPIC: sso.ident.user_registration.clients
      SSO_KAFKA_VERIFICATION_SMS_TOPIC: sso.ident.verification_codes.sms
      SSO_KAFKA_VERIFICATION_EMAIL_TOPIC: sso.ident.verification_codes.email
      SSO_KETO_BASE_URL: http://keto:4467
      SSO_KETO_READ_BASE_URL: http://keto:4466
      SERVER_PORT: 8080
    ports:
      - "8071:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/actuator/health | grep -q UP"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s

  clients:
    build:
      context: ./Services/clients
    image: soa-labs/clients:local
    container_name: clients
    restart: unless-stopped
    depends_on:
      liquibase:
        condition: service_completed_successfully
      redpanda-topic-init:
        condition: service_completed_successfully
    environment:
      SPRING_R2DBC_URL: r2dbc:postgresql://postgres:5432/clients
      SPRING_R2DBC_USERNAME: postgres
      SPRING_R2DBC_PASSWORD: postgres
      SPRING_KAFKA_BOOTSTRAP_SERVERS: redpanda:9092
      KAFKA_CLIENT_GROUP_ID: clients
      KAFKA_USER_REGISTRATION_TOPIC: sso.ident.user_registration.clients
      KAFKA_USER_UPDATES_TOPIC: sso.ident.user_updates.clients
      SERVER_PORT: 8080
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/actuator/health | grep -q UP"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s

  inventory:
    build:
      context: ./Services/inventory
    image: soa-labs/inventory:local
    container_name: inventory
    restart: unless-stopped
    depends_on:
      liquibase:
        condition: service_completed_successfully
      keto-init:
        condition: service_completed_successfully
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/inventory
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      SERVER_PORT: 8080
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/actuator/health | grep -q UP"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s

  tickets:
    build:
      context: ./Services/tickets
    image: soa-labs/tickets:local
    container_name: tickets
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redpanda-topic-init:
        condition: service_completed_successfully
      debezium-connector-init:
        condition: service_completed_successfully
      liquibase:
        condition: service_completed_successfully
    environment:
      TICKETS_DB_URL: jdbc:postgresql://postgres:5432/tickets
      TICKETS_DB_USERNAME: postgres
      TICKETS_DB_PASSWORD: postgres
      TICKETS_DB_POOL_SIZE: 10
      TICKETS_KAFKA_BOOTSTRAP_SERVERS: redpanda:9092
      TICKETS_KAFKA_GROUP_ID: tickets
      TICKETS_KAFKA_TOPIC: inventory.train_set_snapshots
      TICKETS_KAFKA_AUTO_OFFSET_RESET: earliest
      TICKETS_KAFKA_POLL_TIMEOUT_MS: 1000
      TICKETS_MAX_PAGE_SIZE: 100
    ports:
      - "8074:8080"
    healthcheck:
      test: ["CMD-SHELL", "/opt/jboss/wildfly/bin/jboss-cli.sh --connect --commands=\":read-attribute(name=server-state)\" 2>/dev/null | grep -q 'running'"]
      interval: 10s
      timeout: 8s
      retries: 20
      start_period: 30s

  nginx:
    image: nginx:1.29-alpine
    container_name: nginx
    restart: unless-stopped
    depends_on:
      sso-ident:
        condition: service_healthy
      clients:
        condition: service_healthy
      inventory:
        condition: service_healthy
      tickets:
        condition: service_healthy
    volumes:
      - ./Docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 5s
      timeout: 3s
      retries: 10

  oathkeeper:
    image: oryd/oathkeeper:v26.2.0
    container_name: sso-oathkeeper
    restart: unless-stopped
    depends_on:
      keto-init:
        condition: service_completed_successfully
      nginx:
        condition: service_healthy
    ports:
      - "4455:4455"
      - "4456:4456"
    volumes:
      - ./Docker/oathkeeper/oathkeeper.yml:/etc/oathkeeper/oathkeeper.yml:ro
      - ./Docker/oathkeeper/access-rules:/etc/oathkeeper/access-rules:ro
    command: serve --config /etc/oathkeeper/oathkeeper.yml

  sso-ident-system-admin-init:
    image: curlimages/curl:8.16.0
    container_name: sso-ident-system-admin-init
    restart: "no"
    user: root
    depends_on:
      liquibase:
        condition: service_completed_successfully
      keto-init:
        condition: service_completed_successfully
      sso-ident:
        condition: service_healthy
      clients:
        condition: service_healthy
      inventory:
        condition: service_healthy
      tickets:
        condition: service_healthy
      oathkeeper:
        condition: service_started
    environment:
      SYSTEM_ADMIN_EMAIL: ${SYSTEM_ADMIN_EMAIL:-sys@system.local}
      SYSTEM_ADMIN_USERNAME: ${SYSTEM_ADMIN_USERNAME:-sys}
      SYSTEM_ADMIN_PASSWORD: ${SYSTEM_ADMIN_PASSWORD:-system123}
    volumes:
      - sso_admin_state:/state
      - ./Docker/sso-ident-system-admin-init.sh:/init.sh:ro
    command: ["sh", "/init.sh"]

volumes:
  postgres_data:
  redis_data:
  redpanda_data:
  sso_admin_state:
